name: Build firmware (tinySA Ultra+ ZS407, STM32F303)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch upstream tags (for the version string)
        run: git fetch --tags --force --no-recurse-submodules https://github.com/erikkaashoek/tinySA.git || true

      # Same compiler as the official tinySA Ultra builds (GCC 11.3.1 20220712)
      - name: Install Arm GNU Toolchain 11.3.Rel1
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '11.3.Rel1'

      - name: DIAG baseline (upstream main)
        run: |
          git worktree add /tmp/base origin/main
          rmdir /tmp/base/ChibiOS && ln -s "$PWD/ChibiOS" /tmp/base/ChibiOS
          make -C /tmp/base TARGET=F303 -j"$(nproc)" > base.log 2>&1 || (tail -30 base.log; exit 1)
          grep -E "flash0|ram0|ram4" base.log
          arm-none-eabi-size /tmp/base/build/obj/main.o /tmp/base/build/obj/plot.o

      - name: DIAG hot build
        run: |
          make TARGET=F303 -j"$(nproc)" USE_COPT=-Wdouble-promotion > hot.log 2>&1 || (grep -E "error|Error" -B3 -A3 hot.log | head -80; exit 1)
          grep -E "flash0|ram0|ram4" hot.log
          arm-none-eabi-size build/obj/main.o build/obj/plot.o
          echo "== double promotion lines"
          for f in sa_core plot main waterfall; do
            echo "-- $f.c"
            grep -E "^$f\.c:[0-9]+:[0-9]+: warning: implicit conversion from 'float' to 'double'" hot.log | cut -d: -f2 | sort -n -u | tr '\n' ' '
            echo
          done
          echo "== stack usage base vs hot"
          for f in main plot; do
            echo "-- $f base"; sort -t$'\t' -k2 -n -r /tmp/base/build/obj/$f.su | head -12 | cut -c1-80
            echo "-- $f hot";  sort -t$'\t' -k2 -n -r build/obj/$f.su | head -12 | cut -c1-80
          done
          echo "-- perform/sweep"; grep -E ":(perform|sweep|draw_cell|draw_all|plot_into_index)\s" /tmp/base/build/obj/*.su build/obj/*.su | cut -c1-120
          make TARGET=F303 clean > /dev/null 2>&1; rm -rf build

      - name: Build
        run: |
          arm-none-eabi-gcc --version
          make TARGET=F303 -j"$(nproc)"

      - name: Size report
        run: |
          arm-none-eabi-size build/tinySA4.elf
          ls -l build/tinySA4.bin
          echo '### Firmware size' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          arm-none-eabi-size build/tinySA4.elf >> "$GITHUB_STEP_SUMMARY"
          ls -l build/tinySA4.bin >> "$GITHUB_STEP_SUMMARY"
          cat version.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: tinySA4-zs407-firmware
          path: |
            build/tinySA4.bin
            build/tinySA4.hex
            build/tinySA4.elf
            build/tinySA4.map
          if-no-files-found: error
